[project]
name = "eee-project"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.9",
    "marimo>=0.23.8",
    "pyyaml>=6",
    "tomlkit>=0.15.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eee_project"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
markers = ["integration: requires optional deps or network (skipped in CI)"]

[tool.uv.sources]
modern-greek-backend-eee = { path = "../modern-greek-backend-eee" }
unimorph-backend-eee = { path = "../unimorph-backend-eee" }
ancient-greek-backend-eee = { path = "../ancient-greek-backend-eee" }

[dependency-groups]
dev = [
    "marimo>=0.19.4",
    "pandas",
    "pytest>=8",
    "pytest-cov",
    "modern-greek-backend-eee",
    "unimorph-backend-eee",
    "ancient-greek-backend-eee",
]
