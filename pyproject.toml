[project]
name = "eee"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "modern-greek-inflexion-eee @ git+https://github.com/EEE-project/modern-greek-inflexion-eee.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eee"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
modern-greek-inflexion-eee = { git = "https://github.com/EEE-project/modern-greek-inflexion-eee.git" }
ancient-greek-morphology-eee = { git = "https://codeberg.org/EEE-project/ancient-greek-morphology-eee.git" }

[dependency-groups]
dev = [
    "ancient-greek-morphology-eee",
    "marimo>=0.19.4",
    "pytest>=8",
    "pytest-cov",
]
